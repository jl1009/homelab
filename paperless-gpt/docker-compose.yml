version: "3.4"

services:
  paperless-gpt:
    image: icereed/paperless-gpt:latest
    restart: unless-stopped
    ports:
      - "${PORT}:8080"
    volumes:
      - ./prompts:/app/prompts
      - ./config:/app/config
    environment:
      PAPERLESS_BASE_URL: ${PAPERLESS_BASE_URL}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN}
      PAPERLESS_PUBLIC_URL: ${PAPERLESS_PUBLIC_URL}

      # OCR Configuration (Azure Document Intelligence -> Markdown)
      OCR_PROVIDER: ${OCR_PROVIDER}
      AZURE_DOCAI_ENDPOINT: ${AZURE_DOCAI_ENDPOINT}
      AZURE_DOCAI_KEY: ${AZURE_DOCAI_KEY}
      AZURE_DOCAI_MODEL_ID: ${AZURE_DOCAI_MODEL_ID}
      AZURE_DOCAI_OUTPUT_CONTENT_FORMAT: ${AZURE_DOCAI_OUTPUT_CONTENT_FORMAT}
      AZURE_DOCAI_TIMEOUT_SECONDS: ${AZURE_DOCAI_TIMEOUT_SECONDS}
      OCR_PROCESS_MODE: ${OCR_PROCESS_MODE}

      # LLM Configuration (Azure OpenAI)
      LLM_PROVIDER: ${LLM_PROVIDER}
      OPENAI_API_TYPE: ${OPENAI_API_TYPE}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_LANGUAGE: ${LLM_LANGUAGE}

      # Workflow & Tagging Settings
      MANUAL_TAG: ${MANUAL_TAG}
      AUTO_TAG: ${AUTO_TAG}
      FAIL_TAG: ${FAIL_TAG}
      AUTO_OCR_TAG: ${AUTO_OCR_TAG}
      LOG_LEVEL: ${LOG_LEVEL}

      # Enhanced OCR File Settings
      PDF_UPLOAD: ${PDF_UPLOAD}
      CREATE_LOCAL_PDF: ${CREATE_LOCAL_PDF}
      CREATE_LOCAL_HOCR: ${CREATE_LOCAL_HOCR}
      PDF_SKIP_EXISTING_OCR: ${PDF_SKIP_EXISTING_OCR}

      # Chaining OCR -> Classification
      AUTO_OCR_THEN_CLASSIFY: ${AUTO_OCR_THEN_CLASSIFY}

      # Metadata Auto-generation Controls
      AUTO_GENERATE_TITLE: ${AUTO_GENERATE_TITLE}
      AUTO_GENERATE_DOCUMENT_TYPE: ${AUTO_GENERATE_DOCUMENT_TYPE}
      AUTO_GENERATE_TAGS: ${AUTO_GENERATE_TAGS}
      AUTO_GENERATE_CORRESPONDENTS: ${AUTO_GENERATE_CORRESPONDENTS}
      AUTO_GENERATE_CREATED_DATE: ${AUTO_GENERATE_CREATED_DATE}

networks:
  default:
    name: ${DOCKER_NETWORK}
    external: true
